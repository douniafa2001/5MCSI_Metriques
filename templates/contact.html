<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Contact</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      /* Palette : violet foncé + bleu clair */
      --bg1:#0b1020;           /* très sombre */
      --bg2:#120a2a;           /* violet profond */
      --card: rgba(255,255,255,.07);
      --stroke: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);

      --accent:#7dd3fc;        /* bleu clair */
      --accent2:#7c3aed;       /* violet */
      --accent3:#a78bfa;       /* violet clair */

      --shadow: 0 22px 70px rgba(0,0,0,.55);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:34px 16px;

      background:
        radial-gradient(900px 520px at 12% 12%, rgba(125,211,252,.22), transparent 60%),
        radial-gradient(720px 440px at 90% 18%, rgba(124,58,237,.22), transparent 60%),
        radial-gradient(650px 420px at 70% 88%, rgba(167,139,250,.16), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
    }

    .container{
      width: min(980px, 100%);
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap:18px;
    }
    @media (max-width: 860px){
      .container{ grid-template-columns: 1fr; }
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(10px);
      position:relative;
    }

    /* léger liseré dégradé en haut */
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      height:3px;
      background: linear-gradient(90deg, var(--accent2), var(--accent), var(--accent3));
      opacity:.9;
    }

    .left{ padding:28px; }
    .right{ display:flex; flex-direction:column; }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 12px;
      border: 1px solid var(--stroke);
      border-radius:999px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom:14px;
      background: rgba(0,0,0,.12);
    }

    .dot{
      width:10px;height:10px;border-radius:50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      box-shadow: 0 0 0 6px rgba(255,255,255,.04);
    }

    h1{
      margin:0 0 8px 0;
      font-size: clamp(26px, 3.2vw, 38px);
      letter-spacing:-.02em;
      line-height:1.1;
    }

    p{
      margin:0 0 18px 0;
      color: var(--muted);
      line-height:1.6;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media (max-width: 520px){
      .grid{ grid-template-columns: 1fr; }
    }

    label{
      display:block;
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 6px 2px;
    }

    input, textarea{
      width:100%;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.18);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 12px;
      outline:none;
      transition: .15s ease;
      font-size: 14px;
    }

    textarea{ min-height: 130px; resize: vertical; }

    input:focus, textarea:focus{
      border-color: rgba(125,211,252,.65);
      box-shadow: 0 0 0 4px rgba(125,211,252,.14);
    }

    .actions{
      display:flex;
      gap:12px;
      align-items:center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button{
      border:0;
      cursor:pointer;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 800;
      letter-spacing:.01em;
      color:#0b1020;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      box-shadow: 0 14px 34px rgba(125,211,252,.18);
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
    }
    button:hover{
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow: 0 16px 40px rgba(167,139,250,.16);
    }

    .ghost{
      background: rgba(0,0,0,.10);
      color: var(--text);
      border: 1px solid var(--stroke);
      box-shadow: none;
      font-weight: 700;
    }
